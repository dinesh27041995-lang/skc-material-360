<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKC Material 360</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172438;font:16px system-ui}header{background:#142b45;color:white;padding:24px}main{max-width:1100px;margin:auto;padding:20px}section{background:white;padding:22px;border-radius:12px;margin-bottom:18px}input,button,select{font:inherit;padding:10px;border:1px solid #bcc8d4;border-radius:6px;margin:5px}button{background:#174c75;color:white;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}#status{white-space:pre-wrap}form{display:flex;flex-wrap:wrap} [hidden]{display:none!important}</style><header><b>SHIN KHAI CONSTRUCTION</b><h1>Material 360</h1></header><main><p id="status" role="status"></p><section id="login"><h2>Staff login</h2><form id="signin"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Sign in</button></form><button id="reset">Send password setup / reset email</button></section><section id="setup" hidden><h2>Set password</h2><form id="setpass"><input id="newpass" type="password" minlength="8" required placeholder="New password"><button>Save password</button></form></section><div id="app" hidden><section><b id="role"></b><button id="logout">Sign out</button><button id="refresh">Refresh</button><button id="export">Export CSV (Excel)</button><h2>Stock overview</h2><p id="summary"></p><input id="filter" placeholder="Search site or material"></section><section id="editor" hidden><h2>Material entry / update</h2><form id="entry"><input id="site" placeholder="Site name" required><input id="material" placeholder="Material name" required><input id="unit" placeholder="Unit" required><label>Received<input id="received" type="number" min="0" max="2147483647" required></label><label>Issued<input id="issued" type="number" min="0" max="2147483647" required></label><button>Save</button><button type="button" id="cancel">Clear</button></form></section><section style="overflow:auto"><table><thead><tr><th>Site</th><th>Material</th><th>Unit</th><th>Received</th><th>Issued</th><th>Balance</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></section></div></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm';
const db=createClient('https://zazpievqlvixgmvzxefm.supabase.co','sb_publishable_HxSIUFHdnp00KKDE9imO0Q_1P8cYx-y');const $=id=>document.getElementById(id);let role='',data=[],edit=null,recovery=location.hash.includes('type=recovery')||location.hash.includes('type=invite');const msg=s=>$('status').textContent=s;const redirect=location.origin+location.pathname;
async function run(fn){try{await fn()}catch(e){msg(e.message||String(e))}}
async function load(){const {data:d,error}=await db.from('materials').select('*').order('id');if(error)throw error;data=d;render()}
function render(){const q=$('filter').value.toLowerCase();$('rows').replaceChildren();for(const r of data.filter(r=>(r.site_name+' '+r.material_name).toLowerCase().includes(q))){const tr=document.createElement('tr');for(const v of [r.site_name,r.material_name,r.unit,r.collected_qty,r.issued_qty,(r.collected_qty||0)-(r.issued_qty||0)]){const td=document.createElement('td');td.textContent=v??'';tr.append(td)}const td=document.createElement('td');if(role!=='viewer'){const b=document.createElement('button');b.textContent='Edit';b.onclick=()=>{edit=r.id;for(const [k,v] of Object.entries({site:r.site_name,material:r.material_name,unit:r.unit,received:r.collected_qty,issued:r.issued_qty}))$(k).value=v??''; $('editor').scrollIntoView()};td.append(b)}if(role==='admin'){const b=document.createElement('button');b.textContent='Delete';b.onclick=()=>run(async()=>{if(!confirm('Delete this material record?'))return;const {error}=await db.from('materials').delete().eq('id',r.id);if(error)throw error;await load()});td.append(b)}tr.append(td);$('rows').append(tr)}$('summary').textContent=data.length+' material records | '+new Set(data.map(r=>r.site_name)).size+' sites | '+data.filter(r=>(r.collected_qty||0)-(r.issued_qty||0)<=5).length+' records with balance 5 or less'}
async function session(s){$('app').hidden=true;$('login').hidden=!!s;$('setup').hidden=true;data=[];role='';if(!s)return;if(recovery){$('setup').hidden=false;return}const {data:a,error}=await db.from('material_access').select('access_role').eq('user_id',s.user.id).maybeSingle();if(error)throw error;if(!a){msg('Access not approved. Contact administrator.');$('login').hidden=false;await db.auth.signOut();return}role=a.access_role;$('role').textContent=role.toUpperCase();$('editor').hidden=role==='viewer';$('app').hidden=false;await load();msg('Signed in')}
$('signin').onsubmit=e=>{e.preventDefault();run(async()=>{const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)throw error;$('password').value='';await session(data.session)})};$('reset').onclick=()=>run(async()=>{if(!$('email').checkValidity())throw Error('Enter your email first');const {error}=await db.auth.resetPasswordForEmail($('email').value,{redirectTo:redirect});if(error)throw error;msg('Check your email for the password link.')});$('setpass').onsubmit=e=>{e.preventDefault();run(async()=>{const {error}=await db.auth.updateUser({password:$('newpass').value});if(error)throw error;recovery=false;$('newpass').value='';const {data}=await db.auth.getSession();await session(data.session)})};$('logout').onclick=()=>run(async()=>{await db.auth.signOut();location.replace(redirect)});$('refresh').onclick=()=>run(load);$('filter').oninput=render;$('cancel').onclick=()=>{edit=null;$('entry').reset()};$('entry').onsubmit=e=>{e.preventDefault();run(async()=>{const r={site_name:$('site').value.trim(),material_name:$('material').value.trim(),unit:$('unit').value.trim(),collected_qty:Number($('received').value),issued_qty:Number($('issued').value)};if(r.issued_qty>r.collected_qty)throw Error('Issued cannot exceed received');const {error}=await(edit===null?db.from('materials').insert(r):db.from('materials').update(r).eq('id',edit));if(error)throw error;$('cancel').click();await load();msg('Saved')})};$('export').onclick=()=>{const quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';const csv=[['Site','Material','Unit','Received','Issued','Balance'],...data.map(r=>[r.site_name,r.material_name,r.unit,r.collected_qty,r.issued_qty,r.collected_qty-r.issued_qty])].map(r=>r.map(quote).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv'}));a.download='SKC-stock.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};run(async()=>{const {data,error}=await db.auth.getSession();if(error)throw error;await session(data.session)});
</script></html>
